<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Shadow */
        .box{
            border: 3px solid black;
            padding:5px;
            width: 400px;
            height: 20px;
            box-shadow:  2px 5px 5px #70a711;
        }
        /* Outline */
        .text-element{ 
            text-shadow: 1px 2px 1px aqua 
        }
    </style>
</head>
<body>
    <div class="box">
        This is a box with shadow effect created using box-shadow.
    </div>

    <p class="text-element">
        This is a text element with outline effect created using text-shadow.
    </p>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Property</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box {
            border: 5px solid black;
            display: inline-block;
            width: 200px;
            padding: 10px;
            text-align: center;
            margin: 30px; 
        }
        /* .box1 {
            /* display: none; */  
            /* Also removes the element space from the page */
            
            /* visibility: hidden;   */
            /* Hides the element but keeps its space on the page */
    </style>
</head>

<body>
    <div class="box box1">
        This is a box with class " box box1"
    </div>
    <div class="box">This is another box with class "box"</div>

    <span>I am a line of text </span>
    <span>written using two span</span>
</body>
</html>
